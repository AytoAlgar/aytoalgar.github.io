
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Map</title>
<link rel="stylesheet" href="main.css">
<link rel="script" href="main.js">

</head>


<body>


<!-- =====================================================
     15. COMPLETE PAGE LAYOUT
===================================================== -->

<div class="page-layout">


  <!-- ===============================================
       LEFT SIDEBAR
  ================================================ -->

  <aside class="sidebar">


    <!-- LOGO -->

    <header class="logo-area">

      <img
        src="assets/images/escudo2.png"
        alt="Website logo"
      >

    </header>


    <!-- EXTERNAL LINKS -->

    
<nav class="links-area">

  <!-- WEBSITE -->
  <div class="link-item">

    <button class="dropdown-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="dropdown-website">

      Etapas

      <span class="dropdown-arrow">▼</span>

    </button>

    <span class="link-description">
      Información sobre las diferentes etapas.
    </span>

    <div class="dropdown-menu" id="dropdown-website">

      <a href="/etapa-1/">
        Etapa 1
      </a>

      <a href="/etapa-2/">
        Etapa 2
      </a>
      
      <a href="/etapa-3/">
        Etapa 3
      </a>

    </div>

  </div>


  <!-- ABOUT -->
  <div class="link-item">

    <button class="dropdown-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="dropdown-about">

      Comparte.

      <span class="dropdown-arrow">▼</span>

    </button>

    <span class="link-description">
      Ponte en contacto.
    </span>

    <div class="dropdown-menu" id="dropdown-about">

      <a href="https://example.com/our-story">
        Sugiere
      </a>

      <a href="https://example.com/team">
        Comparte
      </a>

    </div>

  </div>





</nav>


  </aside>



  <!-- ===============================================
       RIGHT MAIN CONTENT
  ================================================ -->

  <main class="main-content">

    <div class="right-side-title">
      <p>Bienvenidos a la Ruta del Venado de Algar</p>

      <div class="right-side-info">

        <p>fdlsfkdajkl</p>
      </div>

    </div>


    <div class="map-layout">


      <!-- INTERACTIVE MAP -->

      <div class="map-container">

        <div class="map-wrapper" id="mapWrapper">

          <img
            src="assets/images/mapa ruta venado43.png"
            alt="Interactive map"
          >

          <!-- Markers generated by JavaScript -->

        </div>

      </div>


      <!-- INFORMATION PANEL -->

      <aside
        class="info-panel"
        id="infoPanel"
        aria-live="polite"
        aria-atomic="true"
      >

        <h2>Explora el mapa</h2>

        <p>
          Toca o pasa el ratón por un punto para 
          ver más información.
        </p>

      </aside>


    </div>

  </main>

</div>

<div id="body2">
  </div>
  <div id="credits">
    <p>Página web desarrollada por Pablo Gálvez y Yeray Romero</p>
  </div>



<!-- =====================================================
     16. JAVASCRIPT
===================================================== -->

<script src="main.js"></script>

</body>
</html>
