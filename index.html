
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Map</title>
<link rel="stylesheet" href="main.css">
<link rel="script" href="main.js">

</head>


<body>


<!-- =====================================================
     15. COMPLETE PAGE LAYOUT
===================================================== -->

<div class="page-layout">


  <!-- ===============================================
       LEFT SIDEBAR
  ================================================ -->

  <aside class="sidebar">


    <!-- LOGO -->

    <header class="logo-area">

      <img
        src="assets/images/escudo2.png"
        alt="Website logo"
      >

    </header>


    <!-- EXTERNAL LINKS -->

    <nav class="links-area">

      <div class="link-item">

        <a
          href="/etapa-1"
          
          rel="noopener noreferrer"
        >
          ETAPA 1
        </a>

        <span>El nacimiento</span>

      </div>


      <div class="link-item">

        <a
          href="/etapa-2"
          
          rel="noopener noreferrer"
        >
          ETAPA 2
        </a>

        <span>Crecimiento</span>

      </div>


      <div class="link-item">

        <a
          href="/etapa-3"
          
          rel="noopener noreferrer"
        >
          ETAPA 3
        </a>

        <span>La berrea</span>

      </div>


      <div class="link-item">

        <a
          href="/etapa-4"
          
          rel="noopener noreferrer"
        >
          ETAPA 4
        </a>

        <span>Lorem Ipsum</span>

      </div>

    </nav>

  </aside>



  <!-- ===============================================
       RIGHT MAIN CONTENT
  ================================================ -->

  <main class="main-content">


    <div class="map-layout">


      <!-- INTERACTIVE MAP -->

      <div class="map-container">

        <div class="map-wrapper" id="mapWrapper">

          <img
            src="assets/images/mapa ruta venado43.png"
            alt="Interactive map"
          >

          <!-- Markers generated by JavaScript -->

        </div>

      </div>


      <!-- INFORMATION PANEL -->

      <aside
        class="info-panel"
        id="infoPanel"
        aria-live="polite"
        aria-atomic="true"
      >

        <h2>Explora el mapa</h2>

        <p>
          Toca o pasa el ratón por un punto para 
          ver más información.
        </p>

      </aside>


    </div>

  </main>

</div>

<div id="body2">
  </div>
  <div id="credits">
    <p>Página web desarrollada por Pablo Gálvez y Yeray Romero</p>
  </div>



<!-- =====================================================
     16. JAVASCRIPT
===================================================== -->

<script src="main.js"></script>

</body>
</html>
