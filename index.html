
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Map</title>

<style>

/* =====================================================
   1. CUSTOMIZATION SETTINGS
===================================================== */

:root {

  /* GENERAL PAGE */
  --page-background: #ffffff;
  --page-font: Arial, sans-serif;
  --page-text-color: #222222;

  /* LOGO AREA */
  --logo-area-background: #ffffff;
  --logo-area-height: 110px;
  --logo-area-padding: 20px 30px;
  --logo-area-alignment: flex-start;

  --logo-width: 180px;
  --logo-height: 70px;
  --logo-object-fit: contain;

  /* LEFT LINKS AREA */
  --links-background: #94b97f;
  --links-padding: 25px 30px;
  --links-gap: 40px;

  --links-font-family: Georgia, sans-serif;
  --links-font-size: 30px;
  --links-font-weight: 600;
  --links-text-color: #333333;
  --links-hover-color: #c49a55;

  --links-description-size: 17px;
  --links-description-color: #434343;
  --links-description-weight: 400;

  /* LEFT COLUMN */
  --sidebar-width: 300px;
  --sidebar-background: #f4f4f4;

  /* MAIN CONTENT */
  --main-background: #ffffff;
  --main-padding: 30px;
  --map-panel-gap: 25px;

  /* INFORMATION PANEL */
  --info-panel-width: 300px;
  --info-panel-background: #ffffff;
  --info-panel-padding: 20px;

  /* INFORMATION TITLES */
  --info-title-font: Georgia, serif;
  --info-title-size: 27px;
  --info-title-color: #292929;
  --info-title-accent: #c49a55;

  /* INFO IMAGE */
  --info-image-height: 190px;
  --info-image-radius: 6px;

  /* MAP MARKERS */
  --marker-size: 25px;
  --marker-color: #e5383500;
  --marker-hover-color: #ff9800;

  /* MOBILE */
  --mobile-padding: 15px;
}


/* =====================================================
   2. GENERAL PAGE STYLING
===================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--page-font);
  background: var(--page-background);
  color: var(--page-text-color);
}


/* =====================================================
   3. MAIN DESKTOP LAYOUT
   Left sidebar + right map area
===================================================== */

.page-layout {
  display: flex;
  width: 100%;
  min-height: 100vh;
  align-items: stretch;
}


/* =====================================================
   4. LEFT SIDEBAR
===================================================== */

.sidebar {
  width: var(--sidebar-width);
  flex: 0 0 var(--sidebar-width);

  background: var(--sidebar-background);
  display: flex;
  flex-direction: column;
}


/* LOGO AREA */

.logo-area {
  width: 100%;
  min-height: var(--logo-area-height);
  padding: var(--logo-area-padding);

  display: flex;
  align-items: center;
  justify-content: var(--logo-area-alignment);

  background: var(--logo-area-background);
}

.logo-area img {
  width: var(--logo-width);
  height: var(--logo-height);
  object-fit: var(--logo-object-fit);
  display: block;
  max-width: 100%;
}


/* =====================================================
   5. EXTERNAL LINKS
===================================================== */

.links-area {
  width: 100%;
  padding: var(--links-padding);
  background: var(--links-background);
  border-top-right-radius: 20px;
  border-bottom-right-radius: 20px;

  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;

  gap: var(--links-gap);
}

.link-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}

.link-item a {
  font-family: var(--links-font-family);
  font-size: var(--links-font-size);
  font-weight: var(--links-font-weight);

  color: var(--links-text-color);
  text-decoration: none;

  transition: color 0.2s ease;
}

.link-item a:hover {
  color: var(--links-hover-color);
}

.link-item span {
  font-family: var(--links-font-family);
  font-size: var(--links-description-size);
  font-weight: var(--links-description-weight);

  color: var(--links-description-color);
  line-height: 1.5;
}


/* =====================================================
   6. RIGHT MAIN CONTENT
===================================================== */

.main-content {
  flex: 1;
  min-width: 0;

  padding: var(--main-padding);
  background: var(--main-background);
}


/* =====================================================
   7. MAP AND INFORMATION PANEL
===================================================== */

.map-layout {
  width: 100%;

  display: flex;
  align-items: flex-start;
  gap: var(--map-panel-gap);
}

.map-container {
  flex: 1;
  min-width: 0;
  
}

/*
  Set this aspect ratio to match your map image.
  Example: 1920 x 1080 = 16 / 9
*/

.map-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border-radius: 30px;
}

.map-wrapper > img {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  display: block;
  object-fit: fill;
}


/* =====================================================
   8. MAP MARKERS
===================================================== */

.map-point {
  position: absolute;

  width: var(--marker-size);
  height: var(--marker-size);

  border-radius: 50%;
  background: var(--marker-color);

  border: 5px solid white;
  transform: translate(-50%, -50%);

  cursor: pointer;
  z-index: 2;

  transition:
    background 0.2s ease,
    transform 0.2s ease;
}

.map-point:hover,
.map-point.active,
.map-point:focus-visible {
  background: var(--marker-hover-color);
  transform: translate(-50%, -50%) scale(1.3);
}

.map-point:focus-visible {
  outline: 2px solid var(--marker-hover-color);
  outline-offset: 4px;
}

.map-point.active {
  animation: markerPulse 0.5s ease;
}

@keyframes markerPulse {

  0% {
    transform: translate(-50%, -50%) scale(1);
  }

  50% {
    transform: translate(-50%, -50%) scale(1.5);
  }

  100% {
    transform: translate(-50%, -50%) scale(1.3);
  }

}


/* =====================================================
   9. INFORMATION PANEL
===================================================== */

.info-panel {
  flex: 0 0 var(--info-panel-width);
  width: var(--info-panel-width);

  padding: var(--info-panel-padding);
  background: var(--info-panel-background);

  min-width: 0;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}

.info-panel.changing {
  opacity: 0;
  transform: translateY(8px);
}


/* =====================================================
   10. STYLIZED INFORMATION TITLES
===================================================== */

.info-panel h2 {
  font-family: var(--info-title-font);
  font-size: var(--info-title-size);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.5px;

  color: var(--info-title-color);

  margin-top: 0;
  margin-bottom: 22px;
  padding-bottom: 12px;

  position: relative;

  animation: textAppear 0.4s ease both;
}

.info-panel h2::after {
  content: "";

  position: absolute;
  bottom: 0;
  left: 0;

  width: 45px;
  height: 3px;

  background: var(--info-title-accent);
  border-radius: 3px;
}


/* =====================================================
   11. INFORMATION IMAGES
===================================================== */

.info-image {
  width: 100%;
  height: var(--info-image-height);

  object-fit: cover;
  border-radius: var(--info-image-radius);

  display: block;
  margin-bottom: 20px;

  animation: imageAppear 0.45s ease both;
}

@keyframes imageAppear {

  from {
    opacity: 0;
    transform: scale(0.97);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}


/* =====================================================
   12. INFORMATION TEXT ANIMATION
===================================================== */

.info-panel p {
  line-height: 1.6;

  animation: textAppear 0.4s ease both;
  animation-delay: 0.08s;
}

.info-extra {
  margin-top: 15px;
  line-height: 1.6;

  animation: textAppear 0.4s ease both;
  animation-delay: 0.14s;
}

@keyframes textAppear {

  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


/* =====================================================
   13. RESPONSIVE DESIGN
===================================================== */

/* Tablet and mobile */

@media (max-width: 900px) {

  /* Stack sidebar above map */
  .page-layout {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    flex: none;
  }

  .logo-area {
    min-height: 105px;
    padding: 15px 20px;
  }

  /* Links become horizontal where space allows */
  .links-area {
    flex-direction: column;
    flex-wrap: wrap;
    gap: 22px;
    padding: 20px;
    border-radius: 20px;
  }

  .link-item a {
    font-size: 40px;
  }

  .link-item span {
    font-size: 20px;
  }

  /* Map below links */
  .main-content {
    width: 100%;
    padding: var(--mobile-padding);
  }

  /* Map and info panel stack */
  .map-layout {
    flex-direction: column;
  }

  .map-container {
    width: 100%;
  }

  .info-panel {
    width: 100%;
    flex: none;
  }

  .info-image {
    height: 220px;
  }

}


/* Smaller mobile screens */

@media (max-width: 480px) {

  .links-area {
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
  }

}


/* =====================================================
   14. ACCESSIBILITY: REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

  .info-panel,
  .info-image,
  .info-panel h2,
  .info-panel p,
  .info-extra,
  .map-point.active,
  .links-area a {
    animation: none !important;
    transition: none !important;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     15. COMPLETE PAGE LAYOUT
===================================================== -->

<div class="page-layout">


  <!-- ===============================================

    <!-- LOGO -->

    <header class="logo-area">

<!-- =====================================================
     16. JAVASCRIPT
===================================================== -->

<script>

/*
  LOCATION SETTINGS

  x = horizontal percentage (0–100)
  y = vertical percentage (0–100)

  image = image path shown in information panel
  extra = optional additional information
*/

const locations = [

  {
    id: 1,
    title: "Plaza de la Constitución",
    x: 44,
    y: 15,
    description: "Bla bla bla.",
    image: "assets/images/plaza.png",
    extra: "texto texto texto."
  },

  {
    id: 2,
    title: "Park",
    x: 45,
    y: 55,
    description: "A beautiful green space to explore.",
    image: "images/park.jpg",
    extra: "Additional information about the park."
  },

  {
    id: 3,
    title: "Plaza de la Constitución",
    x: 70,
    y: 35,
    description: "Bla bla bla.",
    image: "images/building.jpg",
    extra: "texto texto texto."
  },

  {
    id: 4,
    title: "Viewpoint",
    x: 80,
    y: 75,
    description: "A viewpoint with a great panorama.",
    image: "images/viewpoint.jpg",
    extra: "Additional information about the viewpoint."
  }

];


/* =====================================================
   GET PAGE ELEMENTS
===================================================== */

const mapWrapper = document.getElementById("mapWrapper");
const infoPanel = document.getElementById("infoPanel");

let transitionTimer;


/* =====================================================
   CREATE MAP POINTS
===================================================== */

locations.forEach(location => {

  const point = document.createElement("button");

  point.type = "button";
  point.className = "map-point";

  point.style.left = location.x + "%";
  point.style.top = location.y + "%";

  point.setAttribute("aria-label", location.title);
  point.title = location.title;

  // Hover interaction
  point.addEventListener("mouseenter", () => {
    showLocation(location, point);
  });

  // Click interaction
  point.addEventListener("click", () => {
    showLocation(location, point);
  });

  // Keyboard focus interaction
  point.addEventListener("focus", () => {
    showLocation(location, point);
  });

  mapWrapper.appendChild(point);

});


/* =====================================================
   DISPLAY LOCATION INFORMATION
===================================================== */

function showLocation(location, selectedPoint) {

  // Remove active state from all markers
  document.querySelectorAll(".map-point").forEach(point => {
    point.classList.remove("active");
  });

  // Activate selected marker
  selectedPoint.classList.add("active");

  // Cancel pending transition
  clearTimeout(transitionTimer);

  // Fade out current information
  infoPanel.classList.add("changing");

  transitionTimer = setTimeout(() => {

    infoPanel.innerHTML = `

      <h2>${escapeHTML(location.title)}</h2>

      ${
        location.image
          ? `<img
               src="${escapeHTML(location.image)}"
               class="info-image"
               alt="${escapeHTML(location.title)}"
             >`
          : ""
      }

      <p>${escapeHTML(location.description)}</p>

      ${
        location.extra
          ? `<div class="info-extra">${escapeHTML(location.extra)}</div>`
          : ""
      }

    `;

    // Fade in new content
    requestAnimationFrame(() => {
      infoPanel.classList.remove("changing");
    });

  }, 200);

}


/* =====================================================
   BASIC HTML ESCAPING
===================================================== */

function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, character => {

    const entities = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    };

    return entities[character];

  });

}

</script>
